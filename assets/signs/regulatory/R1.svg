<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Octagon shape for STOP -->
  <polygon points="30,10 70,10 90,30 90,70 70,90 30,90 10,70 10,30" fill="#CC0000" stroke="#990000" stroke-width="2"/>
  <polygon points="32,12 68,12 88,32 88,68 68,88 32,88 12,68 12,32" fill="#CC0000"/>
  <!-- White background for text -->
  <polygon points="35,20 65,20 80,35 80,65 65,80 35,80 20,65 20,35" fill="white"/>
  <!-- STOP text -->
  <text x="50" y="60" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#CC0000" text-anchor="middle">STOP</text>
</svg>