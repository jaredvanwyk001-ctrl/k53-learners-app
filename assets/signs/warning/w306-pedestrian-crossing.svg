<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Red outer warning triangle -->
  <polygon points="100,12 192,180 8,180" fill="#CC0000"/>
  <!-- White inner fill -->
  <polygon points="100,30 175,166 25,166" fill="white"/>
  <!-- Walking person: head -->
  <circle cx="104" cy="72" r="9" fill="#333"/>
  <!-- Body -->
  <line x1="104" y1="81" x2="100" y2="116" stroke="#333" stroke-width="8" stroke-linecap="round"/>
  <!-- Left arm (raised forward) -->
  <line x1="102" y1="91" x2="80" y2="106" stroke="#333" stroke-width="7" stroke-linecap="round"/>
  <!-- Right arm (back) -->
  <line x1="102" y1="94" x2="120" y2="104" stroke="#333" stroke-width="7" stroke-linecap="round"/>
  <!-- Left leg (forward stride) -->
  <line x1="100" y1="116" x2="82" y2="145" stroke="#333" stroke-width="7" stroke-linecap="round"/>
  <!-- Right leg (back stride) -->
  <line x1="100" y1="116" x2="116" y2="145" stroke="#333" stroke-width="7" stroke-linecap="round"/>
</svg>
