<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>K53 Learner's Licence - Practice & Study</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>🚗 K53 Learner's Licence</h1>
    <p>Complete practice quiz & study guide for South African learner's test</p>
    <nav class="tabs">
      <button class="tab-btn active" data-page="quiz-page">📝 Quiz</button>
      <button class="tab-btn" data-page="signs-page">🪧 Road Signs</button>
      <button class="tab-btn" data-page="reference-page">📚 Reference</button>
      <button class="tab-btn" data-page="progress-page">📊 Progress</button>
    </nav>
  </header>

  <main>

    <!-- ===== QUIZ PAGE ===== -->
    <section id="quiz-page" class="page active">
      <div class="quiz-filters" id="quizFilters"></div>

      <div class="quiz-card" id="quizCard">
        <div class="progress-bar-wrap">
          <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="q-meta">
          <span id="qNumber">Question 1 of 15</span>
          <span id="qType">Road Signs</span>
        </div>

        <div id="qContent"></div>
        <div class="options" id="options"></div>
        <div class="explanation" id="explanation"></div>

        <div class="quiz-actions">
          <button class="btn btn-outline" onclick="app.startQuiz()">🔀 Restart</button>
          <button class="btn btn-primary" id="nextBtn" onclick="app.nextQuestion()">Next →</button>
        </div>
      </div>

      <div class="score-card" id="scoreCard" style="display:none">
        <div class="score-circle" id="scoreCircle">
          <span class="score-pct">0%</span>
          <span class="score-label">0/0</span>
        </div>
        <h2 id="scoreTitle"></h2>
        <p id="scoreMsg"></p>
        <div class="score-mistakes" id="scoreMistakes"></div>
        <button class="btn btn-success" onclick="app.startQuiz()">Try Again</button>
      </div>
    </section>

    <!-- ===== ROAD SIGNS PAGE ===== -->
    <section id="signs-page" class="page">
      <div class="signs-filters" id="signsFilters"></div>
      <div class="signs-grid" id="signsGrid"></div>
    </section>

    <!-- ===== REFERENCE PAGE ===== -->
    <section id="reference-page" class="page">
      <div class="reference-content">
        <div class="reference-section">
          <h3>🚗 Vehicle Controls</h3>
          <div style="text-align: center; margin-bottom: 2rem;">
            <img src="./assets/controls/vehicle_controls_diagram.png" alt="Vehicle Controls" class="controls-img">
          </div>
          <div class="reference-cards" id="controlsReference"></div>
        </div>

        <div class="reference-section">
          <h3>🛣️ Road Markings</h3>
          <div class="reference-cards" id="markingsReference"></div>
        </div>
      </div>
    </section>

    <!-- ===== PROGRESS PAGE ===== -->
    <section id="progress-page" class="page">
      <div id="progressDash"></div>
    </section>

  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
