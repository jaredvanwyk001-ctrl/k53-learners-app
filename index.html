<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>K53 Learner's Licence App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>🚗 K53 Learner's Licence</h1>
    <p>Practice quiz &amp; study guide for the South African learner's test</p>
    <nav class="tabs">
      <button class="tab-btn active" data-page="quizPage">📝 Practice Quiz</button>
      <button class="tab-btn" data-page="controlsPage">🎮 Vehicle Controls</button>
      <button class="tab-btn" data-page="markingsPage">🛣️ Road Markings</button>
      <button class="tab-btn" data-page="progressPage">📊 Progress</button>
    </nav>
  </header>

  <main>

    <!-- ===== QUIZ PAGE ===== -->
    <section id="quizPage" class="page active">

      <div class="filter-bar" id="filterBar"></div>

      <!-- Question card -->
      <div class="quiz-card" id="quizArea">
        <div class="progress-bar-wrap">
          <div class="progress-bar" id="progressBar" style="width:0%"></div>
        </div>

        <div class="q-meta">
          <span id="qCounter">Question 1 of 15</span>
          <span id="qCategory">Road Signs</span>
        </div>

        <p class="q-text" id="qText"></p>

        <div class="options" id="options"></div>

        <div class="explanation" id="explanation"></div>

        <div class="quiz-actions">
          <button class="btn btn-outline" onclick="startQuiz()">🔀 Restart</button>
          <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">Next →</button>
        </div>
      </div>

      <!-- Score screen -->
      <div class="quiz-card score-screen" id="scoreScreen" style="display:none">
        <div class="score-circle score-pass" id="scoreCircle">
          <span class="big">--</span>
          <span class="label">0/0</span>
        </div>
        <h2 id="scoreTitle"></h2>
        <p id="scoreMsg"></p>
        <button class="btn btn-success" onclick="startQuiz()">Try Again</button>
      </div>

    </section>

    <!-- ===== VEHICLE CONTROLS PAGE ===== -->
    <section id="controlsPage" class="page">
      <div style="text-align: center; margin-bottom: 2rem;">
        <img src="/assets/controls/vehicle_controls_diagram.png" alt="Vehicle Controls Diagram" style="max-width: 100%; max-height: 400px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.1);">
      </div>
      <div class="study-grid" id="controlsGrid"></div>
    </section>

    <!-- ===== ROAD MARKINGS PAGE ===== -->
    <section id="markingsPage" class="page">
      <div class="study-grid" id="markingsGrid"></div>
    </section>

    <!-- ===== PROGRESS DASHBOARD PAGE ===== -->
    <section id="progressPage" class="page">
      <div id="progressDashboard"></div>
    </section>

  </main>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
