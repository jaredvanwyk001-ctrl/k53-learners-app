<svg viewBox="0 0 80 100" xmlns="http://www.w3.org/2000/svg">
  <!-- White rectangle with black border -->
  <rect x="5" y="5" width="70" height="90" fill="#FFFFFF" stroke="#000000" stroke-width="2" rx="5"/>
  <!-- SPEED text -->
  <text x="40" y="30" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">SPEED</text>
  <!-- LIMIT text -->
  <text x="40" y="45" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">LIMIT</text>
  <!-- Number (example: 60) -->
  <text x="40" y="80" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#000000" text-anchor="middle">60</text>
</svg>
